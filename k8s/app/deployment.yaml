apiVersion: apps/v1
kind: Deployment
metadata:
  name: mangoon-app
  namespace: mangoon
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mangoon-app
  template:
    metadata:
      labels:
        app: mangoon-app
    spec:
      containers:
        - name: app
          image: your-registry/mangoon-app:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: mangoon-config
            - secretRef:
                name: mangoon-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /up
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /up
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: mangoon-app-service
  namespace: mangoon
spec:
  selector:
    app: mangoon-app
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
