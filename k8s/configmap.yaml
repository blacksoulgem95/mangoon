apiVersion: v1
kind: ConfigMap
metadata:
  name: mangoon-config
  namespace: mangoon
data:
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_URL: "https://mangoon.example.com"
  DB_CONNECTION: "pgsql"
  DB_PORT: "5432"
  REDIS_CLIENT: "phpredis"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  CACHE_STORE: "redis"
  QUEUE_CONNECTION: "redis"
  MANGA_DISK: "s3"
  AWS_USE_PATH_STYLE_ENDPOINT: "false"
  SESSION_DRIVER: "redis"
  SESSION_LIFETIME: "120"
