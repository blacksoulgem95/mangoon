apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mangoon-ingress
  namespace: mangoon
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - mangoon.example.com
      secretName: mangoon-tls
  rules:
    - host: mangoon.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: mangoon-app-service
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mangoon-frontend-service
                port:
                  number: 80
